name: Ariovelle lockfile and verification

on:
  push:
    branches:
      - feat/ariovelle-phase-1-design-system
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ariovelle-phase-1-verification
  cancel-in-progress: false

jobs:
  lockfile-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariovelle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ariovelle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARIOVELLE_MIGRATION_DATABASE_URL: postgres://ariovelle_owner:owner-test-password@127.0.0.1:5432/ariovelle_test
      ARIOVELLE_RLS_TEST_OWNER_DATABASE_URL: postgres://ariovelle_owner:owner-test-password@127.0.0.1:5432/ariovelle_test
      ARIOVELLE_RLS_TEST_RUNTIME_DATABASE_URL: postgres://ariovelle_runtime:runtime-test-password@127.0.0.1:5432/ariovelle_test
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/ariovelle-phase-1-design-system
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Reconcile npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile changes when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: reconcile reproducible npm lockfile"
            git push origin HEAD:feat/ariovelle-phase-1-design-system
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare isolated migration roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ariovelle_owner LOGIN PASSWORD 'owner-test-password' CREATEROLE CREATEDB BYPASSRLS" \
            -c "CREATE ROLE ariovelle_runtime LOGIN PASSWORD 'runtime-test-password' NOBYPASSRLS" \
            -c "CREATE ROLE ariovelle_read_only NOLOGIN" \
            -c "GRANT ariovelle_read_only TO ariovelle_runtime" \
            -c "GRANT ariovelle_runtime TO ariovelle_owner WITH ADMIN OPTION" \
            -c "ALTER DATABASE ariovelle_test OWNER TO ariovelle_owner"
      - name: Apply all schema migrations to an empty PostgreSQL 17 database
        run: npm run db:migrate:apply
      - name: Provision CI-only read access for the RLS integration role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ariovelle_test -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT ON TABLE public.users, public.external_identities, public.user_profiles, public.user_preferences, public.workspaces, public.workspace_memberships, public.audit_events TO ariovelle_read_only"
      - name: Verify checksums and idempotent migration rerun
        run: |
          npm run db:migrate:apply
          npm run db:migrate:verify
      - name: Production build
        run: npm run build
      - name: Automated tests
        run: npm test
