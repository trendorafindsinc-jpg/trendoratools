<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070A" />
    <title>TrendoraTools — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
        background: #07070A;
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #245a46;
        color: white;
        font-size: 32px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      h1 { font-size: 1.25rem; margin-bottom: 8px; }
      p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
      button {
        background: #245a46;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">T</div>
      <h1>You're offline</h1>
      <p>TrendoraTools works offline after the first visit. Reconnect or tap below to retry.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
