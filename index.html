    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Trendora Tools",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "Practical budgeting, expense, bill, debt and savings tools from Trendora under LUCIA. Local-first with optional Lucia Cloud backup.",

        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Trendora",
          "parentOrganization": {
            "@type": "Organization",
            "name": "LUCIA"
          }
        }
      }
    </script>

    <!-- Apply saved theme BEFORE CSS/React -->
    <script>
      (function () {
        try {
          var key = 'trendora_tools_theme';
          var pref = localStorage.getItem(key) || 'dark';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (mode !== 'light' && mode !== 'dark') mode = 'dark';
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-light');
          root.classList.add(mode === 'light' ? 'theme-light' : 'theme-dark');
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode;
          if (mode === 'light') {
            root.style.setProperty('--bg-deep', '#f4f5f8');
            root.style.setProperty('--text-primary', '#0f172a');
            root.style.backgroundColor = '#f4f5f8';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f5f8');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
