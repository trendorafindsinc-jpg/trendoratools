<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Trendora Tools — practical budgeting, expense, savings and financial planning tools from Trendora, under LUCIA." />
    <title>Trendora Tools</title>

    <!-- PWA / Installable app -->
    <meta name="theme-color" content="#07070A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Trendora Tools" />

    <!-- iOS (iPhone) home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trendora Tools" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./brand/trendora-mark.svg" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Apply saved theme BEFORE CSS/React so light mode is never stuck black on first paint -->
    <script>
      (function () {
        try {
          var key = 'trendora_tools_theme';
          var pref = localStorage.getItem(key) || 'dark';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (mode !== 'light' && mode !== 'dark') mode = 'dark';
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-light');
          root.classList.add(mode === 'light' ? 'theme-light' : 'theme-dark');
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode;
          if (mode === 'light') {
            root.style.setProperty('--bg-deep', '#f4f5f8');
            root.style.setProperty('--text-primary', '#0f172a');
            root.style.backgroundColor = '#f4f5f8';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f5f8');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
