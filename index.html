      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ariovelle",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "A unified personal finance, business finance, planning and market intelligence platform by Lucia LLC.",
        "url": "https://ariovelle.lucia.name.ng/",
        "image": "https://ariovelle.lucia.name.ng/icons/icon-512.png",

          "@type": "Organization",
          "name": "Lucia LLC"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var key = 'ariovelle_theme';
          var pref = localStorage.getItem(key) || localStorage.getItem('trendora_tools_theme') || 'dark';
          var mode = pref;
          if (pref === 'system') mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (mode !== 'light' && mode !== 'dark') mode = 'dark';
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-light');
          root.classList.add(mode === 'light' ? 'theme-light' : 'theme-dark');
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode;
          if (mode === 'light') {
            root.style.setProperty('--bg-deep', '#f5f3ee');
            root.style.setProperty('--text-primary', '#172333');
            root.style.backgroundColor = '#f5f3ee';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'light' ? '#f5f3ee' : '#0b111b');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
